<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#000f1e">
<title>MEGA GAMES</title>
<style>
:root{--bg1:#1b1340;--bg2:#0b0a1f;--card:rgba(255,255,255,.08);--text:#f3f0ff;--sub:#a79fd6;--acc:#2de2a6;--acc2:#7b5cff;--heart:#ff4d79;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#efeaff;--bg2:#d9e4ff;--card:rgba(255,255,255,.75);--text:#1d1747;--sub:#5d5792}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2));color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;user-select:none;overflow-y:auto}
body.menu{touch-action:pan-y}body.game{touch-action:none}
.app{width:min(94vw,380px);margin:auto;padding:12px 0 40px}
[hidden]{display:none!important}
h1{text-align:center;margin:0 0 4px;font-size:30px}
.sub{text-align:center;color:var(--sub);margin:0 0 18px;font-size:14px}
.seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:16px}
.seg button{flex:1;border:0;border-radius:12px;padding:10px 0;font:600 15px inherit;font-family:inherit;background:transparent;color:var(--sub)}
.seg button.on{background:linear-gradient(135deg,var(--acc2),#4cc9ff);color:#fff}
.card{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:16px;margin-bottom:12px;background:var(--card);color:var(--text);font-family:inherit;text-align:right;box-shadow:0 0 0 1px rgba(123,92,255,.35)}
.card:active{transform:scale(.98)}
.card i{font-style:normal;font-size:38px}
.card b{display:block;font-size:18px}
.card span{color:var(--sub);font-size:13px}
.top{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.pill{flex:1;background:var(--card);border-radius:16px;padding:6px 12px}
.pill small{display:block;color:var(--sub);font-size:12px}
.pill b{font-size:22px;font-variant-numeric:tabular-nums}
.back{border:0;border-radius:16px;width:50px;background:var(--card);color:var(--text);font-size:20px}
.board{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(123,92,255,.35),0 0 0 2px rgba(123,92,255,.5)}
canvas{display:block;width:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;background:rgba(10,8,30,.75);backdrop-filter:blur(4px);color:#fff;text-align:center}
.ov h2{margin:0;font-size:28px}.ov p{margin:0;color:#cfc8ff;font-size:15px}
.ov button{margin-top:8px;border:0;border-radius:999px;padding:12px 34px;font:700 17px inherit;font-family:inherit;color:#07261c;background:linear-gradient(135deg,var(--acc),#7af0ff);box-shadow:0 6px 18px rgba(45,226,166,.45)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;direction:ltr}
.pad button{height:50px;border:0;border-radius:16px;background:var(--card);color:var(--text);font-size:20px}
.pad button:active{background:var(--acc2);color:#fff}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}.f{grid-column:3;grid-row:1}
.pill{padding:6px 8px}.pill b{font-size:18px}.top{gap:6px}#mm{position:absolute;left:8px;top:8px;width:84px;height:84px;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,8,30,.85);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}.shop{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.shop button{flex:1 1 30%;border:0;border-radius:12px;padding:9px 4px;font:600 13px inherit;font-family:inherit;background:var(--card);color:var(--text)}.shop .on{background:linear-gradient(135deg,var(--acc2),#4cc9ff);color:#fff}.shop .off{opacity:.5}.card.pic{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;gap:0}.card.pic svg{display:block;width:100%}.card.pic div{padding:12px 16px}textarea{width:100%;border-radius:14px;border:0;padding:10px;background:var(--card);color:var(--text);font:13px monospace;user-select:text;-webkit-user-select:text;touch-action:auto}#race{position:fixed;inset:0;background:#000;z-index:99}#rv{position:absolute;overflow:hidden;background:#000;touch-action:none;transition:box-shadow .2s}
#rv.hit{box-shadow:inset 0 0 90px 30px rgba(255,0,0,.6)}#rv.boost{box-shadow:inset 0 0 110px 20px rgba(50,224,255,.45)}#rc{width:100%;height:100%;display:block}
.rh{position:absolute;color:#fff;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}#rp{top:10px;left:14px;font-size:28px}#rd{top:46px;left:14px;font-size:14px}
#rprog{top:16px;left:50%;transform:translateX(-50%);width:34%;height:6px;background:rgba(255,255,255,.3);border-radius:3px}#rprog i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;margin-left:-6px;border:2px solid #fff}
#rspd{top:8px;right:16px;text-align:right;direction:ltr;font-size:40px;line-height:1}#rspd small{font-size:13px;display:block}
#rnb{top:66px;right:16px;width:140px;height:10px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden}#rn{height:100%;width:50%;background:linear-gradient(90deg,#32e0ff,#7b5cff)}
#rx{position:absolute;top:34px;left:50%;transform:translateX(-50%);border:0;border-radius:12px;padding:4px 12px;background:rgba(0,0,0,.45);color:#fff;font-family:inherit}
.rcb{position:absolute;bottom:18px;display:flex;gap:14px;direction:ltr}.rcb.l{left:22px}.rcb.r{right:22px}
.rcb button{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);color:#fff;font-size:30px;touch-action:none}.rcb button:active{background:rgba(255,255,255,.4)}
#nb{width:104px!important;height:104px!important;background:rgba(50,224,255,.35)!important}
#rc3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:900;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none}
:root{--glass:rgba(255,255,255,.13);--gb:rgba(255,255,255,.3);--text:#f3f0ff;--sub:#c4bdf0;--card:rgba(255,255,255,.12)}
body{color:#f3f0ff;background:radial-gradient(900px 560px at 8% -8%,rgba(122,92,255,.9),transparent 60%),radial-gradient(800px 520px at 105% 12%,rgba(0,214,180,.65),transparent 58%),radial-gradient(900px 640px at 50% 112%,rgba(255,77,121,.6),transparent 58%),#0b0a1f}
.pill,.back,.pad button,.shop button,.seg,.card,textarea{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid var(--gb);box-shadow:0 8px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.pad button:active,.shop button:active,.back:active{background:rgba(255,255,255,.32)}
.shop .on{background:linear-gradient(135deg,rgba(123,92,255,.85),rgba(76,201,255,.85))}
.seg button.on{background:linear-gradient(135deg,#7b5cff,#4cc9ff);box-shadow:0 4px 14px rgba(123,92,255,.5)}
h1{font-size:34px;background:linear-gradient(90deg,#fff,#a8ecff,#ffc2d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{transition:transform .15s;border-radius:24px}.card i{filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#game{position:fixed;inset:0;z-index:50;background:radial-gradient(900px 600px at 50% 0%,#2a1d6e,#0b0a1f)}
#game .board{position:absolute;inset:0;border-radius:0;box-shadow:none;display:flex;align-items:center;justify-content:center}
#game .top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;margin:0}
#c{width:min(100vw,calc(100vh - 270px));height:auto;aspect-ratio:1/1;border-radius:18px}
#c3{position:absolute;inset:0;width:100%!important;height:100%!important;aspect-ratio:auto!important}
#game .pad{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;margin:0}
#game .shop{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:5;margin:0}
#game .ov{z-index:4}#mm{top:84px;z-index:3}#toast{z-index:6}
.rcb button,#rx,#rgx,.gl,#rgi{-webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 20px rgba(0,0,0,.35)}
#rv.garage .rh,#rv.garage .rcb,#rv.garage #rx{display:none}
#rg{position:absolute;inset:0;pointer-events:none}#rg>*{pointer-events:auto}
#rgi{position:absolute;left:18px;top:18px;width:min(38%,300px);padding:14px 16px;border-radius:20px;color:#fff;background:rgba(255,255,255,.14)}
#rgi h3{margin:0 0 8px;font-size:22px}.st{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}.st span{width:58px}.st i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}.st b{display:block;height:100%;background:linear-gradient(90deg,#32e0ff,#7b5cff)}
.gl{position:absolute;bottom:24px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px}#rgl{left:calc(50% - 90px)}#rgr{left:calc(50% + 20px)}
#rgs0{position:absolute;bottom:24px;right:24px;padding:16px 30px;border:0;border-radius:999px;font:700 18px inherit;font-family:inherit;color:#07261c;background:linear-gradient(135deg,#2de2a6,#7af0ff);box-shadow:0 8px 24px rgba(45,226,166,.5)}
#rgx{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px}
.logo{display:block;width:84%;max-width:320px;margin:0 auto 4px;filter:drop-shadow(0 0 16px rgba(90,255,60,.35))}</style></style>
</head>

  this.ds=[];for(let i=0;i<20;i++)[-3,0,3].forEach(x=>this.ds.push(bx(.2,.03,4,0xffffff,x,.04,-i*10,sc)));
  this.tr=[];for(let i=0;i<24;i++){const t=new T.Group();bx(.6,1.6,.6,0x6b4a2a,0,.8,0,t);const c=new T.Mesh(new T.ConeGeometry(1.6,3.6,7),mt(0x2f7a3a));c.position.y=3.2;t.add(c);t.position.set((i%2?1:-1)*(9+Math.random()*7),0,-i*9);sc.add(t);this.tr.push(t)}
  this.pc=mkCar(0xe83a3a);sc.add(this.pc);
 },
 init(){if(!this.sc)this.build();this.hi=best('race');$('l1').textContent='امتیاز';$('l2').textContent='بهترین';$('l3').textContent='سرعت';$('l4').textContent='سکه';$('fb').hidden=true;this.reset();this.state='idle';
  overlay('🏎️ مسابقه','درجه: '+DN[diff]+' — ◀▶ یا سوایپ برای عوض کردن خط، ▲ نیترو، ▼ ترمز. به ماشین‌ها نخور و سکه جمع کن!','شروع')},
 reset(){[...(this.cars||[]),...(this.coin||[])].forEach(o=>this.sc.remove(o.m));this.cars=[];this.coin=[];this.dist=0;this.coins=0;this.lane=1;this.px=LX[1];this.v=Rd[diff].sp*mo('carSpeed',1);this.ts=1;this.kd={};held.u=held.d=false;this.pc.position.set(LX[1],0,0);set(0,this.hi,'0','0')},
 start(){this.reset();this.state='play';$('ov').hidden=true},
 key(k,d){if(k=='u'||k=='d'){held[k]=d;return}if(k!='l'&&k!='r')return;if(!d){this.kd[k]=0;return}if(this.kd[k])return;this.kd[k]=1;this.lane=k=='l'?Math.max(0,this.lane-1):Math.min(3,this.lane+1)},
 end(sc){this.state='over';if(sc>this.hi){this.hi=sc;keep('race',sc)}set(sc,this.hi,'0',this.coins);overlay('تصادف! 💥','امتیاز: '+sc+' — سکه: '+this.coins+' — بهترین: '+this.hi,'دوباره')},
 update(dt){
  if(this.state!=='play')return;
  const s=dt/1000,b=Rd[diff].sp*mo('carSpeed',1),tg=b*(1+Math.min(1,this.dist/3000)*.8)*(held.u?1.45:held.d?.6:1);
  this.v+=(tg-this.v)*Math.min(1,s*3);const v=this.v,mz=v*s;this.dist+=mz;
  this.px+=(LX[this.lane]-this.px)*Math.min(1,s*10);this.pc.position.x=this.px;this.pc.rotation.y=(LX[this.lane]-this.px)*.07;
  this.ds.forEach(m=>{m.position.z+=mz;if(m.position.z>12)m.position.z-=200});
  this.tr.forEach(m=>{m.position.z+=mz;if(m.position.z>14){m.position.z-=216;m.position.x=(m.position.x>0?1:-1)*(9+Math.random()*7)}});
  this.ts-=s;
  if(this.ts<=0){const big=Math.random()<.25,ln=Math.random()*4|0;
   if(!this.cars.some(c=>c.z<-95&&Math.abs(c.x-LX[ln])<1)){
    const m=mkCar([0x3a6be8,0xf0c030,0x2fbf71,0xeeeeee,0x9b59b6,0x333333][Math.random()*6|0],big);m.position.set(LX[ln],0,-130);this.sc.add(m);this.cars.push({m,x:LX[ln],z:-130,vt:10+Math.random()*10,big});
    if(Math.random()<.45){const cl=(ln+1+(Math.random()*3|0))%4,g=new THREE.Group(),c=new THREE.Mesh(CG,CM);c.rotation.x=Math.PI/2;g.add(c);g.position.set(LX[cl],1.1,-130-Math.random()*20);this.sc.add(g);this.coin.push({m:g,x:LX[cl],z:g.position.z})}}
   this.ts=Math.max(Rd[diff].tr*Math.max(.5,40/v)/mo('trafficRate',1),14/Math.max(5,v-20))}
  let crash=false;
  this.cars.forEach(c=>{c.z+=(v-c.vt)*s;c.m.position.z=c.z;if(Math.abs(c.x-this.px)<1.9&&Math.abs(c.z)<(c.big?4.6:3.7))crash=true});
  this.cars=this.cars.filter(c=>{if(c.z>25||c.z<-260){this.sc.remove(c.m);return false}return true});
  this.coin=this.coin.filter(c=>{c.z+=mz;c.m.position.z=c.z;c.m.rotation.y+=s*5;if(Math.abs(c.x-this.px)<1.7&&Math.abs(c.z)<2.2){this.coins++;this.sc.remove(c.m);return false}if(c.z>15){this.sc.remove(c.m);return false}return true});
  const sc=(this.dist|0)+this.coins*50;set(sc,this.hi,(v*3.6|0)+'',this.coins);
  this.cam.fov=60+Math.max(0,(v-b)*.25);this.cam.updateProjectionMatrix();
  if(crash)this.end(sc)},
 draw(){const p=this.px;this.cam.position.set(p*.5,4.2,9);this.cam.lookAt(p*.4,1.2,-14);this.r.render(this.sc,this.cam)}};

function open(g){document.body.className='game';G={snake:Snake,war:War,race:Race}[g];$('c').hidden=G!==Snake;$('c3').hidden=G!==War;$('c4').hidden=G!==Race;$('mm').hidden=$('shop').hidden=G!==War;$('p3').hidden=$('p4').hidden=G===Snake;$('c3').style.aspectRatio=$('c4').style.aspectRatio='360/420';
 for(const k in held)held[k]=false;$('menu').hidden=true;$('game').hidden=false;G.init()}
function close(){document.body.className='menu';G=null;$('game').hidden=true;$('menu').hidden=false}
$('back').onclick=close;
$('go').onclick=()=>G&&G.start();
document.querySelectorAll('.card[data-g]').forEach(b=>b.onclick=()=>open(b.dataset.g));
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{diff=b.dataset.v;document.querySelectorAll('#seg button').forEach(c=>c.classList.toggle('on',c===b))});
document.querySelectorAll('.pad button').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();G&&G.key(b.dataset.d,true)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>G&&G.key(b.dataset.d,false)))});
const M={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',' ':'f'};
document.addEventListener('keydown',e=>{if(!G)return;const k=M[e.key];if(k){e.preventDefault();G.key(k,true)}else if(e.key==='Enter'&&G.state!=='play')G.start()});
document.addEventListener('keyup',e=>{const k=M[e.key];if(G&&k)G.key(k,false)});
function cp(e){const r=$('c3').getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
$('c3').addEventListener('pointerdown',e=>{if(G===War){const q=cp(e);War.ptr('down',q[0],q[1])}});
$('c3').addEventListener('pointermove',e=>{if(G===War&&War.fire){const q=cp(e);War.ptr('move',q[0],q[1])}});
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('c3').addEventListener(ev,()=>G===War&&War.ptr('up')));
let t0=null;
document.addEventListener('touchstart',e=>{t0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
document.addEventListener('touchend',e=>{
 if(!(G===Snake||G===Race)||!t0||e.target.closest('.pad,.ov'))return;
 const dx=e.changedTouches[0].clientX-t0[0],dy=e.changedTouches[0].clientY-t0[1];
 if(Math.max(Math.abs(dx),Math.abs(dy))>=24){const k=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');G.key(k,true);if(G===Race)G.key(k,false)}t0=null});
function loop(t){const dt=Math.min(50,t-last);last=t;if(G){G.update(dt);G.draw(t)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
