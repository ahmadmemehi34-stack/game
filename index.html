<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجموعه بازی</title>
<style>
:root{--bg1:#1b1340;--bg2:#0b0a1f;--card:rgba(255,255,255,.08);--text:#f3f0ff;--sub:#a79fd6;--acc:#2de2a6;--acc2:#7b5cff;--heart:#ff4d79;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#efeaff;--bg2:#d9e4ff;--card:rgba(255,255,255,.75);--text:#1d1747;--sub:#5d5792}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2));color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
.app{width:min(94vw,380px)}
[hidden]{display:none!important}
h1{text-align:center;margin:0 0 4px;font-size:30px}
.sub{text-align:center;color:var(--sub);margin:0 0 18px;font-size:14px}
.seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:16px}
.seg button{flex:1;border:0;border-radius:12px;padding:10px 0;font:600 15px inherit;font-family:inherit;background:transparent;color:var(--sub)}
.seg button.on{background:linear-gradient(135deg,var(--acc2),#4cc9ff);color:#fff}
.card{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:16px;margin-bottom:12px;background:var(--card);color:var(--text);font-family:inherit;text-align:right;box-shadow:0 0 0 1px rgba(123,92,255,.35)}
.card:active{transform:scale(.98)}
.card i{font-style:normal;font-size:38px}
.card b{display:block;font-size:18px}
.card span{color:var(--sub);font-size:13px}
.top{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.pill{flex:1;background:var(--card);border-radius:16px;padding:6px 12px}
.pill small{display:block;color:var(--sub);font-size:12px}
.pill b{font-size:22px;font-variant-numeric:tabular-nums}
.back{border:0;border-radius:16px;width:50px;background:var(--card);color:var(--text);font-size:20px}
.board{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(123,92,255,.35),0 0 0 2px rgba(123,92,255,.5)}
canvas{display:block;width:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;background:rgba(10,8,30,.75);backdrop-filter:blur(4px);color:#fff;text-align:center}
.ov h2{margin:0;font-size:28px}.ov p{margin:0;color:#cfc8ff;font-size:15px}
.ov button{margin-top:8px;border:0;border-radius:999px;padding:12px 34px;font:700 17px inherit;font-family:inherit;color:#07261c;background:linear-gradient(135deg,var(--acc),#7af0ff);box-shadow:0 6px 18px rgba(45,226,166,.45)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;direction:ltr}
.pad button{height:50px;border:0;border-radius:16px;background:var(--card);color:var(--text);font-size:20px}
.pad button:active{background:var(--acc2);color:#fff}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}.f{grid-column:3;grid-row:1}
.pill{padding:6px 8px}.pill b{font-size:18px}.top{gap:6px}#mm{position:absolute;left:8px;top:8px;width:84px;height:84px;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,8,30,.85);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}.shop{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.shop button{flex:1 1 30%;border:0;border-radius:12px;padding:9px 4px;font:600 13px inherit;font-family:inherit;background:var(--card);color:var(--text)}.shop .on{background:linear-gradient(135deg,var(--acc2),#4cc9ff);color:#fff}.shop .off{opacity:.5}.card.pic{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;gap:0}.card.pic svg{display:block;width:100%}.card.pic div{padding:12px 16px}textarea{width:100%;border-radius:14px;border:0;padding:10px;background:var(--card);color:var(--text);font:13px monospace;user-select:text;-webkit-user-select:text;touch-action:auto}</style>
</head>
<body>
<div class="app">

<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#ffb38a"/></linearGradient></defs>
<rect width="360" height="150" fill="url(#sk)"/><circle cx="290" cy="42" r="20" fill="#ffe9a8"/>
<path d="M0 110Q90 70 180 105T360 95V150H0Z" fill="#2f7a4a"/><path d="M0 130Q120 100 230 128T360 120V150H0Z" fill="#256a3e"/>
<rect x="60" y="88" width="34" height="26" fill="#c9a36b"/><polygon points="54,90 77,64 100,90" fill="#8b4a2b"/><circle cx="112" cy="110" r="5" fill="#ff7a1a"/>
<g fill="#7fb069"><circle cx="190" cy="98" r="8"/><rect x="183" y="105" width="14" height="22" rx="3"/><circle cx="228" cy="104" r="8"/><rect x="221" y="111" width="14" height="22" rx="3"/></g>
<path d="M255 128c20-24 40 8 60-12s20-14 30-8" fill="none" stroke="#2de2a6" stroke-width="10" stroke-linecap="round"/><path d="M26 28c0-8 10-8 10 0 0-8 10-8 10 0 0 10-10 16-10 20 0-4-10-10-10-20Z" fill="#ff4d79"/>
</svg>
    <h1>🎮 مجموعه بازی</h1>
    <p class="sub">درجه سختی رو انتخاب کن و بازی رو شروع کن</p>
    <div class="seg" id="seg"><button data-v="e">آسان</button><button data-v="m" class="on">متوسط</button><button data-v="h">سخت</button></div>

    <button class="card pic" data-g="war"><svg viewBox="0 0 360 120" role="img" aria-label="تصویر دفاع از قبیله"><defs><linearGradient id="nk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1033"/><stop offset="1" stop-color="#5a3a6a"/></linearGradient></defs><rect width="360" height="120" fill="url(#nk)"/><circle cx="305" cy="30" r="16" fill="#fff4c2"/><circle cx="60" cy="20" r="1.5" fill="#fff"/><circle cx="150" cy="35" r="1.5" fill="#fff"/><circle cx="230" cy="15" r="1.5" fill="#fff"/><rect y="92" width="360" height="28" fill="#1f4a2c"/><g fill="#c9a36b"><rect x="40" y="66" width="38" height="28"/><rect x="150" y="72" width="30" height="22"/><rect x="250" y="68" width="34" height="26"/></g><g fill="#8b4a2b"><polygon points="34,68 59,44 84,68"/><polygon points="145,74 165,54 185,74"/><polygon points="244,70 267,48 290,70"/></g><circle cx="112" cy="90" r="5" fill="#ff7a1a"/><path d="M20 30L120 62" stroke="#ff9a3c" stroke-width="3" stroke-dasharray="6 4"/><circle cx="120" cy="62" r="5" fill="#ff4422"/><g fill="#7fb069"><circle cx="205" cy="84" r="7"/><rect x="199" y="90" width="12" height="20" rx="3"/><circle cx="320" cy="86" r="7"/><rect x="314" y="92" width="12" height="20" rx="3"/></g><g fill="#f33"><circle cx="203" cy="83" r="1.3"/><circle cx="207" cy="83" r="1.3"/></g></svg><div><b>🧟 دفاع از قبیله ۳بعدی</b><span>خونه‌ها، محافظ، اسلحه، موشک، تخت‌خواب و پول</span></div></button>
    <button class="card" id="modb"><i>🧩</i><div><b>مود</b><span>با یه کد، بازی رو تغییر بده</span></div></button>
    <div id="modp" hidden><textarea id="modt" rows="5" dir="ltr" spellcheck="false" placeholder='{"startMoney":1000,"rocketCost":500}'></textarea>
      <div class="seg" style="margin:8px 0 0"><button id="moda">اعمال</button><button id="modr">پاک کردن مود</button></div><p class="sub" id="modm" style="margin:8px 0 0"></p></div>
  </div>
  <div id="game" hidden>
    <div class="top">
      <button class="back" id="back" aria-label="منو">✕</button>
      <div class="pill"><small id="l1"></small><b id="v1">0</b></div>
      <div class="pill"><small id="l2"></small><b id="v2">0</b></div>
      <div class="pill" id="p3" hidden><small>خانه‌ها</small><b id="v3">0</b></div><div class="pill" id="p4" hidden><small>پول</small><b id="v4">0</b></div>
    </div>
    <div class="board"><canvas id="c" width="360" height="360"></canvas><canvas id="c3" width="360" height="420" hidden></canvas><canvas id="mm" width="96" height="96" hidden></canvas><div id="toast" hidden></div>
      <div class="ov" id="ov"><h2 id="t"></h2><p id="m"></p><button id="go">شروع</button></div></div>
    <div class="pad">
      <button class="u" data-d="u" aria-label="بالا">▲</button><button class="f" id="fb" data-d="f" aria-label="شلیک">🔫</button>
      <button class="l" data-d="l" aria-label="چپ">◀</button><button class="d" data-d="d" aria-label="پایین">▼</button><button class="r" data-d="r" aria-label="راست">▶</button>
    </div>
    <div class="shop" id="shop" hidden></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
let diff='m',G=null,last=0;const held={};
let MOD={};try{MOD=JSON.parse(localStorage.getItem('mod')||'{}')||{}}catch(e){}
const mo=(k,d)=>typeof MOD[k]==='number'&&isFinite(MOD[k])&&MOD[k]>0?MOD[k]:d;
function applyMod(){if(typeof WP==='undefined')return;WP[1].cost=mo('rifleCost',250);WP[2].cost=mo('shotgunCost',450);WP[3].cost=mo('rocketCost',900);WP[3].dm=mo('rocketDamage',3)}
const DF={e:{s:180,smin:120,sp:1500,es:26},m:{s:140,smin:85,sp:1000,es:38},h:{s:105,smin:60,sp:700,es:50}};
const DN={e:'آسان',m:'متوسط',h:'سخت'};
const best=k=>{try{return+localStorage.getItem('b_'+k+diff)||0}catch(e){return 0}};
const keep=(k,v)=>{try{localStorage.setItem('b_'+k+diff,v)}catch(e){}};
const light=()=>matchMedia('(prefers-color-scheme:light)').matches&&document.documentElement.dataset.theme!=='dark';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function overlay(t,m,b){$('t').textContent=t;$('m').textContent=m;$('go').textContent=b;$('ov').hidden=false}
function set(a,b,c,d){$('v1').textContent=a;$('v2').textContent=b;if(c!==undefined){$('v3').textContent=c;$('v4').textContent=d}}

const Snake={w:360,h:360,S:24,N:15,
 init(){this.hi=best('snake');$('l1').textContent='امتیاز ❤';$('l2').textContent='بهترین';$('fb').hidden=true;this.reset();this.state='idle';
  overlay('🐍 مار','درجه: '+DN[diff]+' — به دیوار و بدن خودت نخور!','شروع')},
 reset(){this.sn=[[7,7],[6,7],[5,7]];this.dir=this.nx=V.r;this.score=0;this.acc=0;this.sp=DF[diff].s/mo('snakeFast',1);this.dead=false;this.toast=0;this.place();set(0,this.hi)},
 place(){do{this.f=[Math.random()*15|0,Math.random()*15|0]}while(this.sn.some(s=>s[0]==this.f[0]&&s[1]==this.f[1]))},
 start(){this.reset();this.state='play';$('ov').hidden=true},
 key(k,d){if(!d||this.state!=='play'||!V[k])return;const v=V[k];if(v[0]+this.dir[0]===0&&v[1]+this.dir[1]===0)return;this.nx=v},
 update(dt){
  if(this.toast>0)this.toast-=dt;
  if(this.state!=='play')return;
  this.acc+=dt;
  while(this.acc>=this.sp&&this.state==='play'){this.acc-=this.sp;this.step()}
 },
 step(){
  this.dir=this.nx;const h=[this.sn[0][0]+this.dir[0],this.sn[0][1]+this.dir[1]],N=this.N;
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||this.sn.some(s=>s[0]==h[0]&&s[1]==h[1])){
    this.state='over';this.dead=true;
    if(this.score>this.hi){this.hi=this.score;keep('snake',this.hi)}
    set(this.score,this.hi);overlay('باختی 💥','تعداد قلب‌ها: '+this.score,'دوباره');return}
  this.sn.unshift(h);
  if(h[0]==this.f[0]&&h[1]==this.f[1]){
    this.score++;if(this.score==20)this.toast=2500;
    if(this.score>this.hi){this.hi=this.score;keep('snake',this.hi)}
    set(this.score,this.hi);this.place();this.sp=Math.max(DF[diff].smin/mo('snakeFast',1),this.sp-3);
  }else this.sn.pop();
 },
 draw(t){
  const S=this.S,N=this.N,L=light(),sk=this.score>=20;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=(i+j)%2?(L?'#f7f5ff':'#1a1840'):(L?'#ebe7ff':'#14123a');x.fillRect(i*S,j*S,S,S)}
  const p=1+Math.sin(t/180)*.12,fx=this.f[0]*S+S/2,fy=this.f[1]*S+S/2,s=S*.36*p;
  x.shadowColor='#ff4d79';x.shadowBlur=18;x.fillStyle='#ff4d79';x.beginPath();x.moveTo(fx,fy+s*.9);
  x.bezierCurveTo(fx-s*1.5,fy-s*.1,fx-s*.8,fy-s*1.1,fx,fy-s*.4);x.bezierCurveTo(fx+s*.8,fy-s*1.1,fx+s*1.5,fy-s*.1,fx,fy+s*.9);x.fill();x.shadowBlur=0;
  const n=this.sn.length;
  for(let i=n-1;i>=0;i--){
    const q=this.sn[i],k=1-i/Math.max(n,6)*.55,g=i?2:1;
    if(sk){x.shadowColor='#ff9a1f';x.shadowBlur=i?8:16;x.fillStyle=`hsl(${28+(i%6)*5},96%,${50+k*10}%)`;x.beginPath();x.arc(q[0]*S+S/2,q[1]*S+S/2,S/2-(i?2:0.5),0,7);x.fill()}
    else{x.shadowColor='#2de2a6';x.shadowBlur=i?6:14;x.fillStyle=`hsl(${160+(1-k)*110},80%,${48+k*8}%)`;x.beginPath();x.roundRect(q[0]*S+g,q[1]*S+g,S-g*2,S-g*2,i?7:10);x.fill()}
  }
  x.shadowBlur=0;
  const h=this.sn[0],ex=this.dir[0],ey=this.dir[1],cx=h[0]*S+S/2,cy=h[1]*S+S/2;
  [-1,1].forEach(d=>{const ax=cx+ex*4-ey*d*5,ay=cy+ey*4+ex*d*5;
    x.fillStyle='#fff';x.beginPath();x.arc(ax,ay,3.4,0,7);x.fill();
    x.fillStyle=this.dead?'#ff4d79':'#12102e';x.beginPath();x.arc(ax+ex,ay+ey,1.7,0,7);x.fill()});
  if(sk){x.font='16px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('👑',cx,cy-S*.7)}
  if(this.toast>0){x.fillStyle='rgba(10,8,30,.75)';x.fillRect(60,150,240,56);x.fillStyle='#ffc94d';x.font='bold 20px Tahoma';x.textAlign='center';x.textBaseline='middle';x.fillText('✨ ظاهر جدید مار! ✨',180,178)}
 }};

const GC={},MC={};
const gm=(w,h,d)=>{const k=w+','+h+','+d;return GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d))};
const mt=c=>MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,roughness:.85}));
function bx(w,h,d,c,px,py,pz,g,rx){const m=new THREE.Mesh(gm(w,h,d),mt(c));m.position.set(px,py,pz);if(rx)m.rotation.x=rx;m.castShadow=true;g.add(m);return m}
function mkChar(k){
 const P={z:[0x7fb069,0x5a4a6a,0x3a3a55],r:[0xe0b080,0x8a1f1f,0x222222],p:[0xf2c9a0,0x2f7bff,0x333a66],t:[0xb07a50,0xb5651d,0x6b4a2a],b:[0xf2c9a0,0x1c1c22,0x111116]}[k],g=new THREE.Group();
 g.lL=bx(.35,.8,.4,P[2],-.22,.4,0,g);g.lR=bx(.35,.8,.4,P[2],.22,.4,0,g);
 bx(.9,.9,.5,P[1],0,1.25,0,g);bx(.55,.55,.55,P[0],0,2,0,g);
 if('zpb'.includes(k)){bx(.28,.8,.3,P[0],-.55,1.5,.4,g,-1.5);bx(.28,.8,.3,P[0],.55,1.5,.4,g,-1.5)}
 else{bx(.28,.8,.3,P[0],-.6,1.2,0,g);bx(.28,.8,.3,P[0],.6,1.2,0,g)}
 if(k=='z'){bx(.1,.1,.06,0x990000,-.15,2.05,.29,g);bx(.1,.1,.06,0x990000,.15,2.05,.29,g)}
 if(k=='p'||k=='b'){g.gun=bx(.14,.14,.9,0x222222,0,1.5,.8,g)}
 if(k=='p'){bx(.9,.08,.9,0x7a4a21,0,2.3,0,g);bx(.5,.3,.5,0x7a4a21,0,2.5,0,g)}
 if(k=='b')bx(.5,.12,.06,0x000000,0,2.05,.29,g);
 if(k=='r'){bx(.62,.3,.62,0x555555,0,2.35,0,g);bx(.6,.1,.6,0xcc2222,0,2.15,0,g);bx(.08,.08,1.9,0x8b5a2b,.7,1.3,.5,g)}
 if(k=='t')bx(.1,.5,.1,0xdd2222,0,2.5,0,g);
 return g}
function mkHouse(w,c,rc){const g=new THREE.Group();bx(w,2.2,w,c,0,1.1,0,g).receiveShadow=true;
 const r=new THREE.Mesh(new THREE.ConeGeometry(w*.8,1.8,4),mt(rc));r.position.y=3.1;r.rotation.y=Math.PI/4;r.castShadow=true;g.add(r);bx(.7,1.3,.1,0x4a2c14,0,.65,w/2+.02,g);return g}
const BG=new THREE.SphereGeometry(.18,6,6),BM=new THREE.MeshBasicMaterial({color:0xffd84d}),RM=new THREE.MeshBasicMaterial({color:0xff4422});
const WP=[{e:'🔫',n:'پیستول',cd:280,pl:1,sd:.02,sp:30,life:1.3,dm:1,cost:0,col:0x222222},
 {e:'⚡',n:'تفنگ',cd:110,pl:1,sd:.05,sp:36,life:1.3,dm:1,cost:250,col:0x444a55},
 {e:'💥',n:'شاتگان',cd:650,pl:5,sd:.25,sp:26,life:.5,dm:1,cost:450,col:0x6b4a2a},
 {e:'🚀',n:'موشک',cd:1200,pl:1,sd:0,sp:17,life:2,dm:3,cost:900,rk:1,col:0x2a5a2a}];
const AW={pl:1,sd:.05,sp:30,life:1.1,dm:1},BED={x:6,z:-3};
const War={w:360,h:420,
 build(){
  const T=THREE,r=this.r=new T.WebGLRenderer({canvas:$('c3'),antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(360,420,false);r.shadowMap.enabled=true;r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;
  const sc=this.sc=new T.Scene();sc.background=new T.Color(0x9ad0ff);sc.fog=new T.Fog(0x9ad0ff,32,75);
  this.cam=new T.PerspectiveCamera(50,360/420,.1,100);
  this.hem=new T.HemisphereLight(0xffffff,0x446644,.9);sc.add(this.hem);
  const s=this.sun=new T.DirectionalLight(0xfff2d8,1.1);s.position.set(14,24,10);s.castShadow=true;s.shadow.mapSize.set(1024,1024);
  Object.assign(s.shadow.camera,{left:-32,right:32,top:32,bottom:-32,far:80});sc.add(s);
  const gr=new T.Mesh(new T.PlaneGeometry(140,140),new T.MeshStandardMaterial({color:0x4a8a4a,roughness:1}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;sc.add(gr);
  const di=new T.Mesh(new T.CircleGeometry(15,32),new T.MeshStandardMaterial({color:0x8a7650,roughness:1}));di.rotation.x=-Math.PI/2;di.position.y=.02;di.receiveShadow=true;sc.add(di);
